dependencies:
  espressif/cjson: "^1.7.19"
  espressif/esp-sr: "2.5.3"
  espressif/esp_h264: "^1.3.6"
  lvgl/lvgl: "9.4.0"
  espressif/esp_lcd_touch: "^1.1"
  espressif/esp_lcd_touch_gt911: "^1"
  espressif/esp_lcd_st7701:
    rules:
      - if: "target == esp32p4"
    override_path: ../components/esp_lcd_st7701
  espressif/esp_lvgl_adapter:
    override_path: ../components/esp_lvgl_adapter
  espressif/tinyusb:
    version: "*"
    rules:
      - if: "target == esp32p4"
  waveshare/esp32_p4_wifi6_touch_lcd_4_3:
    rules:
      - if: "target == esp32p4"
    override_path: ../components/esp32_p4_wifi6_touch_lcd_4_3
