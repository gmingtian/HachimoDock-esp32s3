name: Desktop clients
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/desktop-clients.yml
      - pc/**
      - firmware/tools/prepare_s3_assets.py
      - docs/INSTALLATION.md
      - docs/COMPATIBILITY.md
permissions:
  contents: read
concurrency:
  group: desktop-clients-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: ${{ matrix.target }} desktop client
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-15
            target: macos
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pc/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Restore native Cargo build cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pc/src-tauri/target
          key: s3-home-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('pc/src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            s3-home-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('pc/src-tauri/Cargo.lock') }}-
      - name: Install native build dependencies
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          python -m pip install PyInstaller==6.16.0
          npm ci --prefix pc
      - name: Verify Apple-silicon runner and dependencies
        if: matrix.target == 'macos'
        run: |
          test "$(uname -m)" = arm64
          brew install nasm pkg-config
      - name: Install Windows helper compiler
        if: matrix.target == 'windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-nasm make diffutils curl tar xz
      - name: Build Windows S3 FFmpeg helper from source
        if: matrix.target == 'windows'
        shell: msys2 {0}
        run: bash pc/scripts/build-s3-ffmpeg.sh pc/src-tauri/generated-runtime/s3
      - name: Build macOS S3 FFmpeg helper from source
        if: matrix.target == 'macos'
        run: bash pc/scripts/build-s3-ffmpeg.sh pc/src-tauri/generated-runtime/s3
      - name: Freeze standalone S3 converter
        run: python pc/scripts/build-s3-converter.py --output-dir pc/src-tauri/generated-runtime/s3
      - name: Stage pinned upstream LGPL media runtime
        run: python pc/scripts/prepare-preview-resources.py --target ${{ matrix.target }} --cache-dir "${{ runner.temp }}/upstream-runtime"
      - name: Prepare ordinary audited desktop resources
        working-directory: pc
        run: |
          if [ '${{ matrix.target }}' = windows ]; then
            export PET_MANAGER_BUILD_FFMPEG_BIN="$GITHUB_WORKSPACE/pc/src-tauri/generated-runtime/s3/s3-ffmpeg.exe"
          else
            export PET_MANAGER_BUILD_FFMPEG_BIN="$GITHUB_WORKSPACE/pc/src-tauri/generated-runtime/s3/s3-ffmpeg"
          fi
          node scripts/prepare-desktop-resources.mjs --target ${{ matrix.target }}
      - name: Verify native resources and actual S3 conversion
        run: python pc/scripts/verify-preview-resources.py --target ${{ matrix.target }} --tools-dir pc/src-tauri/generated-runtime/s3 --manifest "${{ runner.temp }}/preview-resource-manifest.json"
      - name: Targeted packaging tests
        run: |
          if [ '${{ matrix.target }}' = windows ]; then
            export FFMPEG="$GITHUB_WORKSPACE/pc/src-tauri/generated-runtime/s3/s3-ffmpeg.exe"
          else
            export FFMPEG="$GITHUB_WORKSPACE/pc/src-tauri/generated-runtime/s3/s3-ffmpeg"
          fi
          python -m unittest discover -s pc/scripts/tests -p 'test_*.py' -v
          if [ '${{ matrix.target }}' = windows ]; then
            S3_TEST_BASH="$(cygpath -w "$BASH")" python pc/scripts/test-s3-ffmpeg-build.py
          else
            python pc/scripts/test-s3-ffmpeg-build.py
          fi
          npm --prefix pc run build:web
      - name: Native S3 routing regression tests
        working-directory: pc/src-tauri
        run: cargo test --locked --release --lib s3_ -- --nocapture
      - name: Build Windows installer
        if: matrix.target == 'windows'
        working-directory: pc
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis --ci
      - name: Build Apple-silicon app
        if: matrix.target == 'macos'
        working-directory: pc
        run: npx tauri build --target aarch64-apple-darwin --bundles app --ci
      - name: Package and verify installed contents
        run: python pc/scripts/package-desktop-client.py --target ${{ matrix.target }} --output-dir artifacts/desktop-clients
      - name: Upload verified preview downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HachimoDock-esp32-s3-${{ matrix.target }}
          path: artifacts/desktop-clients/*
          if-no-files-found: error
          retention-days: 14
      - name: Save native Cargo cache for fixes
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pc/src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
